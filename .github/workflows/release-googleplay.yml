name: Publish to Google Play

on:
  workflow_run:
    workflows: ["Build and Release"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-googleplay:
    name: Publish to Google Play
    runs-on: ubuntu-22.04
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: uad-shizuku-all.aab
          path: ./artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Google Play
        # https://github.com/marketplace/actions/upload-android-release-to-play-store
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: pe.nikescar.uad_shizuku
          releaseFiles: ./artifacts/uad-shizuku-all.aab
          track: production # alpha/beta/production
          status: completed
          inAppUpdatePriority: 2
