name: Build and Release

on:
  push:
    tags:
      - v*
    branches:
      - test
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - linux
          - windows
          - macos
          - freebsd
          - android

env:
  RUST_VERSION: stable
  BIN_NAME: "uad-shizuku"

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    # By default, runs on Ubuntu, otherwise, override with the desired os
    runs-on: ${{ matrix.platform.os || 'ubuntu-22.04' }}
    strategy:
      matrix:
        # Set platforms you want to build your binaries on
        platform:
          # Linux
          - name: Linux x86_64
            target: x86_64-unknown-linux-musl
            build-args: "--release"
            platform_type: linux

          - name: Linux x86
            target: i686-unknown-linux-musl
            build-args: "--release"
            platform_type: linux

          - name: Linux aarch64
            target: aarch64-unknown-linux-musl
            build-args: "--release"
            platform_type: linux

          - name: Linux armv7hf
            target: armv7-unknown-linux-musleabihf
            build-args: "--release"
            platform_type: linux

          - name: Linux armv6
            target: arm-unknown-linux-musleabihf
            build-args: "--release"
            platform_type: linux

          # FreeBSD
          - name: FreeBSD x86_64
            target: x86_64-unknown-freebsd
            build-args: "--release"
            freebsd_version: "14.2"
            platform_type: freebsd

          - name: Android aarch64
            target: aarch64-linux-android
            build-args: "--release"
            platform_type: android

          - name: Android APK arm64
            target: aarch64-linux-android
            build-args: "--release"
            platform_type: android

          - name: Android armv7
            target: armv7-linux-androideabi
            build-args: "--release"
            platform_type: android

          #- name: Linux mips
          #  target: mips-unknown-linux-musl

          #- name: Linux mips64
          #  target: mips64-unknown-linux-muslabi64

          # Mac OS
          - name: MacOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            build-args: "--release"
            platform_type: macos

          - name: MacOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            build-args: "--release"
            platform_type: macos

          # - name: iOS x86_64
          #   target: x86_64-apple-ios

          #- name: iOS aarch64
          #  target: aarch64-apple-ios

          # Windows
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            build-args: "--profile release-with-symbols"
            platform_type: windows

          - name: Windows x86
            os: windows-latest
            target: i686-pc-windows-msvc
            build-args: "--profile release-with-symbols"
            platform_type: windows

          - name: Windows aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            build-args: "--profile release-with-symbols"
            platform_type: windows

    steps:
      - name: Linux - Install Build Dependencies
        if: contains(matrix.platform.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools libgtk-3-dev libxdo-dev libappindicator3-dev libglib2.0-dev libgdk-pixbuf-2.0-dev libwayland-dev libcairo2-dev libpixman-1-dev libpango1.0-dev libxdo-dev librust-glib-sys-dev librust-gio-sys-dev librust-gobject-sys-dev librust-gdk-sys-dev libwebkit2gtk-4.1-dev librust-gdk-pixbuf-sys-dev librust-cairo-sys-rs-dev librust-pango-sys-dev librust-atk-sys-dev libgdk-pixbuf2.0-dev libatk1.0-dev musl-dev
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-musl/pkgconfig"

      - name: Android - Install Build Dependencies
        if: contains(matrix.platform.target, 'android')
        run: |
          sudo apt-get update
          sudo apt-get install -y android-libunwind android-libunwind-dev libunwind-dev musl-tools llvm-14 clang llvm

      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update Version from Git Tag
        shell: bash
        run: |
          # Extract version from git tag (remove 'v' prefix if present)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
            echo "Detected version: $VERSION"
            # Update version in Cargo.toml (compatible with both GNU and BSD sed)
            sed -i.bak "s/^version = .*/version = \"$VERSION\"/" ./Cargo.toml && rm -f ./Cargo.toml.bak
            echo "Updated Cargo.toml with version $VERSION"
            grep "^version = " ./Cargo.toml
          else
            echo "Not a tag build, skipping version update"
            VERSION=$(git describe --tags --always --dirty)
            echo "Build version: $VERSION"
          fi

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.platform.target }}
          components: rustfmt, clippy

      - name: Android - Install Cross-Compilation Tool
        if: contains(matrix.platform.target, 'android')
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Android - Build Release APK
        if: |
          (contains(matrix.platform.name, 'Android APK arm64')) &&
          (github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'android' || github.event.inputs.platforms == '')
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > ./mobile/app/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> ./mobile/app/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> ./mobile/app/keystore.properties
          echo "storeFile=release.keystore" >> ./mobile/app/keystore.properties
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ./mobile/app/release.keystore
          echo "${{ secrets.STORE_PASSWORD }}" | keytool -list -v -keystore $PWD/mobile/app/release.keystore

          pushd mobile
          bash ./build.gh.sh

          # Verify outputs
          echo "=== Listing APK outputs ==="
          ls -alh ./app/build/outputs/apk/release/ || echo "APK directory not found"
          echo "=== Listing AAB outputs ==="
          ls -alh ./app/build/outputs/bundle/release/ || echo "AAB directory not found"

          # Copy APK for artifact upload
          cp ./app/build/outputs/apk/release/app-release.apk ./app/build/outputs/apk/release/uad-shizuku-all-signed.apk
          # Copy AAB for artifact upload
          cp ./app/build/outputs/bundle/release/app-release.aab ./app/build/outputs/apk/release/uad-shizuku-all.aab
          popd

      - name: Build Binary for ${{ matrix.platform.name }}
        if: |
          (contains(matrix.platform.target, 'x86_64') || contains(matrix.platform.target, 'i686') || contains(matrix.platform.target, 'aarch64') || contains(matrix.platform.target, 'armv7') || contains(matrix.platform.target, 'arm-')) &&
          !contains(matrix.platform.name, 'Android APK arm64') && !contains(matrix.platform.target, 'freebsd') &&
          (github.event.inputs.platforms == 'all' || github.event.inputs.platforms == matrix.platform.platform_type || github.event.inputs.platforms == '')
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: ${{ matrix.platform.build-args }} --package uad-shizuku

      - name: Build FreeBSD Binary in VM
        if: |
          contains(matrix.platform.target, 'freebsd') &&
          (github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'freebsd' || github.event.inputs.platforms == '')
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.platform.freebsd_version }}
          usesh: true
          prepare: |
            pkg install -y curl pkgconf gtk3 cairo pango gdk-pixbuf2 at-spi2-core pixman wayland bzip2
            ln -sf /usr/local/bin/pkgconf /usr/local/bin/pkg-config || true
            export PKG_CONFIG_PATH=/usr/local/libdata/pkgconfig:/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig
            mkdir -p /usr/local/libdata/pkgconfig
            # FreeBSD base ships bzip2 and zlib without pkgconfig metadata, which
            # breaks pango/cairo's transitive freetype2 -> bzip2/zlib pkg-config lookup.
            # Synthesize minimal .pc files pointing at the real headers/libs.
            for lib in bzip2:bz2:bzlib.h zlib:z:zlib.h; do
              pcname=${lib%%:*}
              rest=${lib#*:}
              libname=${rest%%:*}
              header=${rest#*:}
              if pkg-config --exists "$pcname" 2>/dev/null; then
                continue
              fi
              incdir=$(dirname "$(find /usr/include /usr/local/include -name "$header" 2>/dev/null | head -1)")
              libdir=$(dirname "$(find /usr/lib /usr/local/lib -name "lib${libname}.so*" 2>/dev/null | head -1)")
              if [ -n "$incdir" ] && [ -n "$libdir" ]; then
                printf 'Name: %s\nDescription: %s compression library (FreeBSD base, synthesized .pc)\nVersion: 1.0.0\nLibs: -L%s -l%s\nCflags: -I%s\n' \
                  "$pcname" "$pcname" "$libdir" "$libname" "$incdir" > "/usr/local/libdata/pkgconfig/${pcname}.pc"
                echo "Synthesized ${pcname}.pc (include=${incdir}, lib=${libdir})"
              else
                echo "::warning::Could not locate headers/libs for ${pcname} (header=${header}, lib=lib${libname}.so)"
              fi
            done
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile=minimal --default-toolchain ${{ env.RUST_VERSION }}
          run: |
            . $HOME/.cargo/env
            export PKG_CONFIG_PATH=/usr/local/libdata/pkgconfig:/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig
            cargo build --release --package uad-shizuku --target ${{ matrix.platform.target }}

      - name: Windows - Code Signing
        if: |
          (contains(matrix.platform.target, 'windows') && env.WINDOWS_CERT_P12_BASE64 != '' && env.WINDOWS_CERT_PASSWORD != '') &&
          (github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'windows' || github.event.inputs.platforms == '')
        id: sign_exe
        env:
          WINDOWS_CERT_P12_BASE64: ${{ secrets.WINDOWS_CERT_P12_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          # Decode the certificate
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERT_P12_BASE64)
          [System.IO.File]::WriteAllBytes("windows.pfx", $certBytes)

          # Verify the executable exists
          echo "Checking for build output..."
          Get-ChildItem -Path target -Recurse -Filter "*.exe" | Format-Table FullName

          $EXE_PATH = "target/release-with-symbols/uad-shizuku.exe"
          if (-Not (Test-Path $EXE_PATH)) {
            echo "::error:: Executable not found at $EXE_PATH"
            echo "Listing target directory contents:"
            Get-ChildItem -Path target -Recurse | Format-Table FullName
            exit 1
          }
          echo "Signing $EXE_PATH..."

          # Validate the certificate before signing so a bad pfx fails with a clear reason
          # instead of the opaque "No certificates were found that met all the given criteria."
          try {
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
              "windows.pfx", $env:WINDOWS_CERT_PASSWORD,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
          } catch {
            echo "::error:: Failed to load windows.pfx - likely wrong WINDOWS_CERT_PASSWORD or a corrupted/invalid certificate file: $_"
            exit 1
          }
          echo "Certificate Subject: $($cert.Subject)"
          echo "Certificate Thumbprint: $($cert.Thumbprint)"
          echo "Certificate NotAfter: $($cert.NotAfter)"
          echo "Certificate HasPrivateKey: $($cert.HasPrivateKey)"
          $eku = $cert.Extensions | Where-Object { $_.Oid.FriendlyName -eq 'Enhanced Key Usage' }
          if ($eku) {
            echo "Certificate EKU: $($eku.Format($false))"
          }
          if (-Not $cert.HasPrivateKey) {
            echo "::error:: windows.pfx has no private key - re-export the certificate with 'Include all certificates in the certification path if possible' and the private key included"
            exit 1
          }
          if ($cert.NotAfter -lt (Get-Date)) {
            echo "::error:: Certificate expired on $($cert.NotAfter)"
            exit 1
          }

          # Find signtool.exe (it's part of the Windows SDK)
          $SIGNTOOL_PATH = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Sort-Object VersionInfo -Descending | Select-Object -First 1).FullName
          if ($null -eq $SIGNTOOL_PATH) {
            echo "::error:: signtool.exe not found."
            exit 1
          }
          echo "Using signtool at $SIGNTOOL_PATH"

          # Sign the file
          & $SIGNTOOL_PATH sign /f "windows.pfx" /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 $EXE_PATH

          # Clean up
          Remove-Item windows.pfx

      - name: Windows - Rename Binary by Architecture
        if: |
          contains(matrix.platform.target, 'windows') &&
          (github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'windows' || github.event.inputs.platforms == '')
        shell: pwsh
        run: |
          $arch = switch -Wildcard ("${{ matrix.platform.target }}") {
            "x86_64-*"  { "x86_64" }
            "i686-*"    { "i686" }
            "aarch64-*" { "aarch64" }
            default     { "${{ matrix.platform.target }}" }
          }
          $src = "target/release-with-symbols/uad-shizuku.exe"
          $dst = "target/release-with-symbols/uad-shizuku-$arch.exe"
          if (Test-Path $src) {
            Move-Item -Force $src $dst
            echo "Renamed $src -> $dst"
          } elseif (Test-Path $dst) {
            echo "$dst already exists, skipping rename"
          } else {
            echo "::error:: Neither $src nor $dst found"
            exit 1
          }

      - name: Upload Binary Artifact
        if: (!contains(matrix.platform.name, 'Android APK arm64'))
        uses: actions/upload-artifact@v4
        with:
          # Finally, we store the binary as GitHub artifact for later usage
          name: uad-shizuku-${{ matrix.platform.target }}
          path: ${{ contains(matrix.platform.target, 'freebsd') && format('target/{0}/release/uad-shizuku*', matrix.platform.target) || format('target/release{0}/uad-shizuku*', contains(matrix.platform.target, 'windows') && '-with-symbols' || '') }}
          retention-days: 1

      - name: Android - Upload APK Artifact
        if: (contains(matrix.platform.name, 'Android APK arm64'))
        uses: actions/upload-artifact@v4
        with:
          name: uad-shizuku-all-signed.apk
          path: ./mobile/app/build/outputs/apk/release/uad-shizuku-all-signed.apk
          retention-days: 1

      - name: Android - Upload AAB Artifact
        if: (contains(matrix.platform.name, 'Android APK arm64'))
        uses: actions/upload-artifact@v4
        with:
          name: uad-shizuku-all.aab
          path: ./mobile/app/build/outputs/apk/release/uad-shizuku-all.aab
          retention-days: 1

  release:
    name: Release
    needs: [build]
    # We run the release job only if a tag starts with 'v' letter
    if: startsWith( github.ref, 'refs/tags/v' )
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Download all artifacts
      - uses: actions/download-artifact@v4.1.7
        with:
          path: artifacts

      - name: VirusTotal Scan
        id: vt_scan
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          update_release_body: false
          request_rate: 4
          files: |
            ./artifacts/uad-shizuku-aarch64-apple-darwin/uad-shizuku
            ./artifacts/uad-shizuku-aarch64-linux-android/uad-shizuku
            ./artifacts/uad-shizuku-aarch64-unknown-linux-musl/uad-shizuku
            ./artifacts/uad-shizuku-all-signed.apk/uad-shizuku-all-signed.apk
            ./artifacts/uad-shizuku-armv7-linux-androideabi/uad-shizuku
            ./artifacts/uad-shizuku-armv7-unknown-linux-musleabihf/uad-shizuku
            ./artifacts/uad-shizuku-x86_64-apple-darwin/uad-shizuku
            ./artifacts/uad-shizuku-x86_64-unknown-linux-musl/uad-shizuku
            ./artifacts/uad-shizuku-x86_64-unknown-freebsd/uad-shizuku
            ./artifacts/uad-shizuku-x86_64-pc-windows-msvc/uad-shizuku-x86_64.exe
            ./artifacts/uad-shizuku-i686-pc-windows-msvc/uad-shizuku-i686.exe
            ./artifacts/uad-shizuku-aarch64-pc-windows-msvc/uad-shizuku-aarch64.exe

      - name: Parse Analysis Results
        id: parse_results
        run: |
          # Extract changelog from CHANGELOG.md (first "What's Changed" section only)
          CHANGELOG_CONTENT=""
          if [ -f "CHANGELOG.md" ]; then
            echo "Extracting changelog from CHANGELOG.md..."

            # Read the first "What's Changed" section
            # Stop at the next "##" heading or end of file
            CHANGELOG_RAW=$(awk '
              /^## What'\''s Changed$/ { in_section=1; next }
              in_section && /^##/ { exit }
              in_section && NF { print }
            ' CHANGELOG.md)

            # Process changelog: remove "by @username" and deduplicate
            if [ -n "$CHANGELOG_RAW" ]; then
              # Remove "by @username" pattern and deduplicate lines
              CHANGELOG_CONTENT=$(echo "$CHANGELOG_RAW" | \
                sed -E 's/ by @[a-zA-Z0-9_-]+//g' | \
                awk '!seen[$0]++')

              echo "Processed changelog:"
              echo "$CHANGELOG_CONTENT"
            fi
          fi

          # Get the analysis output from previous step
          ANALYSIS="${{ steps.vt_scan.outputs.analysis }}"

          echo "Raw analysis output:"
          echo "$ANALYSIS"

          # Parse the analysis output and format for release notes
          # Format: file1=url1,file2=url2,...

          VT_RESULTS=""

          # Check if we have any results
          if [ -z "$ANALYSIS" ]; then
            echo "Warning: No analysis output from VirusTotal scan"
            VT_RESULTS="⚠️ VirusTotal scan encountered errors. Some files may have been scanned previously (409 error)."
          else
            # Split by comma and process each entry
            IFS=',' read -ra ENTRIES <<< "$ANALYSIS"
            for entry in "${ENTRIES[@]}"; do
              # Skip empty entries
              if [ -z "$entry" ]; then
                continue
              fi

              # Split by = to get file and URL
              IFS='=' read -r file url <<< "$entry"

              # Skip if file or url is empty
              if [ -z "$file" ] || [ -z "$url" ]; then
                continue
              fi

              # Extract identifier from path
              # For .exe and .apk files, use the filename
              # For other files (binaries), use the parent directory name which contains platform info
              if [[ "$file" == *.exe ]] || [[ "$file" == *.apk ]]; then
                identifier=$(basename "$file")
              else
                identifier=$(basename "$(dirname "$file")")
              fi

              # Build markdown link
              VT_RESULTS="${VT_RESULTS}- **${identifier}**: [View VirusTotal Report](${url})\n"
            done

            # Check if we have formatted results
            if [ -z "$VT_RESULTS" ]; then
              echo "Warning: No valid results to format"
              VT_RESULTS="⚠️ No scan results available. Files may have been scanned recently."
            fi
          fi

          # Combine changelog and VirusTotal results
          FORMATTED_RESULTS=""

          if [ -n "$CHANGELOG_CONTENT" ]; then
            FORMATTED_RESULTS="${FORMATTED_RESULTS}## What's Changed\n${CHANGELOG_CONTENT}\n\n"
          fi

          FORMATTED_RESULTS="${FORMATTED_RESULTS}## VirusTotal Scan Results\n${VT_RESULTS}"

          # Save to output (escape for GitHub Actions)
          echo "formatted_results<<EOF" >> $GITHUB_OUTPUT
          echo -e "$FORMATTED_RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "Formatted results:"
          echo -e "$FORMATTED_RESULTS"

      - name: Prepare Release Artifacts
        run: |
          find artifacts/
          mkdir distbin/

          for i in ./artifacts/*
          do
              if [ -d "$i" ]
              then
                  # Handle APK separately
                  [[ "$i" == *"uad-shizuku-all-signed.apk"* ]] && cp artifacts/uad-shizuku-all-signed.apk/uad-shizuku-all-signed.apk distbin/uad-shizuku-all-signed.apk && continue

                  # Handle Windows executables - already named by architecture from the build job
                  if [[ "$i" == *"x86_64-pc-windows-msvc"* ]]; then
                      cp "$i"/uad-shizuku-x86_64.exe distbin/uad-shizuku-x86_64.exe 2>/dev/null || true
                      continue
                  elif [[ "$i" == *"i686-pc-windows-msvc"* ]]; then
                      cp "$i"/uad-shizuku-i686.exe distbin/uad-shizuku-i686.exe 2>/dev/null || true
                      continue
                  elif [[ "$i" == *"aarch64-pc-windows-msvc"* ]]; then
                      cp "$i"/uad-shizuku-aarch64.exe distbin/uad-shizuku-aarch64.exe 2>/dev/null || true
                      continue
                  fi

                  # Handle other platforms - tar compress
                  cp LICENSE* "$i"
                  cp README.md "$i"
                  rm "$i/uad-shizuku.d" 1>/dev/null 2>&1 || true
                  chmod +x "$i/uad-shizuku" 1>/dev/null 2>&1 || true
                  tar -cvpzf "${i}.tar.gz" --directory=${i} .
              fi
          done
          cp artifacts/*.tar.gz distbin/ 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          # draft: true
          make_latest: true
          files: distbin/*
          body: ${{ steps.parse_results.outputs.formatted_results }}
          token: ${{ secrets.RELEASE_TOKEN }}
