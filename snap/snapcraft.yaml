name: uad-shizuku
base: core24
version: '0.0.15'
summary: Universal Android Debloater with Shizuku support
description: |
  UAD-SHIZUKU is application for remove bloat app selectively, get sha256sum of
  installed foss android apps and install foss apps selectively.
 
  Features:
  * Debloat application with bloat app list selectively
  * Get sha256sum of app list and scan with virustotal api
  * Get android foss offa app list and install through obtanium
  * Get android foss fmhy app list and install through obtanium
 
  It supports android mode(apk) with adb wireless shizuku and
  linux/macos/windows mode(binary) with adb platform-tools.
 
  Open source, cross-platform, written in Rust.
 
grade: stable
confinement: classic
 
apps:
  uad-shizuku:
    command: bin/uad-shizuku
 
parts:
  uad-shizuku:
    plugin: nil
    source: .
    source-type: git
    build-packages:
      - pkg-config
      - libssl-dev
      - libgtk-3-dev
      - libgdk-pixbuf2.0-dev
      - libglib2.0-dev
      - libcairo2-dev
      - libpango1.0-dev
      - libatk1.0-dev
      - git
    stage-packages:
      - libgtk-3-0
      - libgdk-pixbuf2.0-0
      - libglib2.0-0
      - libcairo2
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libatk1.0-0
      - ca-certificates
    build-attributes:
      - enable-patchelf
    override-pull: |
        craftctl default
    override-build: |
        # Use system rustup/cargo
        export PATH="$HOME/.cargo/bin:$PATH"
        export RUSTFLAGS="-Clink-arg=-Wl,-rpath=\$ORIGIN/lib:/snap/core24/current/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR -Clink-arg=-Wl,-dynamic-linker=$(find /snap/core24/current/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR -name 'ld*.so.*' -print | head -n1)"
 
        # Reduce parallelism to avoid OOM
        export CARGO_BUILD_JOBS=2
 
        # Build with cargo
        cargo build --release
 
        # Install the binary
        install -Dm755 target/release/uad-shizuku "$CRAFT_PART_INSTALL"/bin/uad-shizuku
